name: Deploy BCS2050 Digital Twin to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "workers/**"
      - "docs/**"
      - "frontend/**"
      - "Dockerfile"
      - ".github/workflows/deploy-digital-twin.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: bcs2050
  REGION: northamerica-south1
  SERVICE_NAME: bcs2050-digital-twin
  SERVICE_ACCOUNT: sa-bcs2050-agent-sandbox@bcs2050.iam.gserviceaccount.com

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend & test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi "uvicorn[standard]" pydantic pyyaml shapely numpy httpx ezdxf pyproj google-cloud-bigquery google-cloud-firestore google-cloud-pubsub google-cloud-storage mapbox-vector-tile mercantile psycopg2-binary scipy networkx wntr rasterio google-genai pytest

      - name: Fetch spatial datastore artifact (if configured)
        if: ${{ (vars.GCS_DATA_TAR_URI != '' || vars.GCS_SPATIAL_INDEX_URI != '') && secrets.GCP_WIF_PROVIDER != '' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - name: Download runtime bundle & spatial datastore for full integration tests
        if: ${{ (vars.GCS_DATA_TAR_URI != '' || vars.GCS_SPATIAL_INDEX_URI != '') && secrets.GCP_WIF_PROVIDER != '' }}
        run: |
          if [ -n "${{ vars.GCS_DATA_TAR_URI }}" ]; then
            gcloud storage cp "${{ vars.GCS_DATA_TAR_URI }}" /tmp/twin_data.tar.gz
            tar -xzf /tmp/twin_data.tar.gz -C .
          elif [ -n "${{ vars.GCS_SPATIAL_INDEX_URI }}" ]; then
            gcloud storage cp "${{ vars.GCS_SPATIAL_INDEX_URI }}" data/spatial_index.sqlite
          fi

      - name: Run security & API unit tests
        run: |
          if [ -f data/spatial_index.sqlite ]; then
            python -m pytest backend/tests -v
          else
            python -m pytest backend/tests/test_twin_api.py -k "security or architecture" -v
          fi

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & build React/Cesium/deck.gl bundle
        working-directory: frontend
        run: |
          npm ci
          npm run build

  deploy-cloud-run:
    needs: [test-backend, build-frontend]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend dist
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Sync intelligence runtime module from GCS (zero baked spatial bloat)
        run: |
          if [ -n "${{ vars.GCS_DATA_TAR_URI }}" ]; then
            gcloud storage cp "${{ vars.GCS_DATA_TAR_URI }}" /tmp/twin_data.tar.gz
            tar -xzf /tmp/twin_data.tar.gz -C .
            rm -rf data /tmp/twin_data.tar.gz
          fi

      - name: Deploy hardened Cloud Run revision
        run: |
          gcloud run deploy "${{ env.SERVICE_NAME }}" \
            --source . \
            --project "${{ env.PROJECT_ID }}" \
            --region "${{ env.REGION }}" \
            --service-account "${{ env.SERVICE_ACCOUNT }}" \
            --memory 2Gi \
            --cpu 2 \
            --max-instances 10 \
            --concurrency 160 \
            --allow-unauthenticated \
            --set-secrets="VITE_GOOGLE_MAPS_API_KEY=bcs2050-google-maps-3dtiles-key:latest" \
            --set-env-vars "^@^BCS2050_USE_BIGQUERY=true@BCS2050_USE_FIRESTORE=true@BCS2050_FIRESTORE_DATABASE=bcs-studio@BCS2050_TELEMETRY_PUBSUB_TOPIC=bcs2050-telemetry-events@BCS2050_GCS_HYDRATE_DATA=true@BCS2050_GCS_DATA_TAR_URI=${{ vars.GCS_DATA_TAR_URI }}@BCS2050_3DTILES_URL=https://storage.googleapis.com/bcs2050-3dtiles-public/bcs_buildings_v11/tileset.json@BCS2050_USE_CLOUD_RUN_JOBS=true@BCS2050_PHYSICS_JOB_NAME=bcs2050-physics-worker@BCS2050_SIM_ARTIFACTS_BUCKET=bcs2050-3dtiles-public@GOOGLE_CLOUD_PROJECT=${{ env.PROJECT_ID }}@GOOGLE_CLOUD_LOCATION=global@BCS2050_CHAT_MODEL=gemini-4-hydrogen@BQ_LOCATION=${{ env.REGION }}@BQ_DATASET=bcs2050_intelligence_sandbox@TERRITORIAL_IA_URL=https://bcs2050-territorial-ia-96586614897.northamerica-south1.run.app@BCS2050_HEAVY_RPM=12@BCS2050_READ_RPM=180@BCS2050_REQUIRE_AUTH_FOR_EXPORTS=false@ALLOWED_ORIGINS=https://bcs2050.com,https://www.bcs2050.com,https://panel.bcs2050.com,https://twin.bcs2050.com,https://bcs2050-digital-twin-96586614897.northamerica-south1.run.app,https://bcs2050-digital-twin-4aurr37ktq-pv.a.run.app" \
            --quiet
